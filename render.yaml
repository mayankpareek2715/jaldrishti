databases:
  - name: jaldrishti-db
    databaseName: jaldrishti
    user: jaldrishti_user
    plan: free

services:
  # -------------------------------------------------------------
  # 1. FastAPI ML Microservice (Calibrated XGBoost Nowcasting)
  # -------------------------------------------------------------
  - type: web
    name: jaldrishti-ml
    runtime: docker
    dockerContext: ./ml-service
    dockerfilePath: ./ml-service/Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true

  # -------------------------------------------------------------
  # 2. Spring Boot 3 REST Backend & GIS Engine
  # -------------------------------------------------------------
  - type: web
    name: jaldrishti-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/localities
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: jaldrishti-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: jaldrishti-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: jaldrishti-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: jaldrishti-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jaldrishti-db
          property: password
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: jaldrishti-ml
          property: host
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # -------------------------------------------------------------
  # 3. React + Vite Frontend (GIS Command Center UI)
  # -------------------------------------------------------------
  - type: web
    name: jaldrishti-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: jaldrishti-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
